<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, follow">
  <title>Pagina no encontrada | Calculadora de precio de impresion 3D</title>
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
  <style>
    :root {
      color-scheme: light;
      --primary: #0f766e;
      --text: #17212f;
      --muted: #5b6f7d;
      --soft: #eef6f5;
      --line: #c8ddd9;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      color: var(--text);
      background: linear-gradient(180deg, #ffffff 0%, var(--soft) 100%);
      font-family: Arial, Helvetica, sans-serif;
    }

    main {
      width: min(680px, 100%);
      padding: 36px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #ffffff;
      box-shadow: 0 22px 50px rgba(15, 23, 42, 0.08);
    }

    p:first-child {
      margin: 0 0 10px;
      color: var(--primary);
      font-weight: 800;
      text-transform: uppercase;
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(2rem, 7vw, 3.5rem);
      line-height: 1;
    }

    .lead {
      margin: 0 0 24px;
      color: var(--muted);
      font-size: 1.1rem;
      line-height: 1.6;
    }

    a {
      display: inline-flex;
      min-height: 46px;
      align-items: center;
      justify-content: center;
      padding: 0 18px;
      border-radius: 8px;
      background: var(--primary);
      color: #ffffff;
      font-weight: 800;
      text-decoration: none;
    }

    a:focus-visible {
      outline: 3px solid #f4b63f;
      outline-offset: 3px;
    }
  </style>
</head>
<body>
  <main>
    <p>Error 404</p>
    <h1>No encontramos esta pagina.</h1>
    <p class="lead">Puedes volver a la calculadora y continuar trabajando con tus costos, cotizaciones e inventario.</p>
    <a href="./index.html">Volver a la calculadora</a>
  </main>
</body>
</html>
